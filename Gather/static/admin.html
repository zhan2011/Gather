<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>管理后台</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">

  <!-- ========== 登录 ========== -->
  <div class="login-wrap" id="loginView" style="display:none">
    <h1>管理员登录</h1>
    <p class="sub">登录后可发起报名 / 问卷 / 投票，也能直接参与</p>
    <div class="card">
      <div class="field">
        <label for="loginUser">用户名</label>
        <input id="loginUser" type="text" autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label for="loginPass">密码</label>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <button class="btn primary block" id="btnLogin">登 录</button>
      <div class="hint-line" style="text-align:center;margin-top:14px">
        <a href="/">← 返回首页</a>
      </div>
    </div>
  </div>

  <!-- ========== 管理 ========== -->
  <div id="adminView" style="display:none">
    <header class="admin-head">
      <h1>管理后台</h1>
      <span class="spacer"></span>
      <a class="btn small" href="/">首页</a>
      <button class="btn small" id="btnLogout">退出</button>
    </header>
    <div class="hint-line" id="meInfo" style="margin:-8px 0 14px"></div>

    <div class="seg" id="seg">
      <button data-tab="activities" class="active">活动管理</button>
      <button data-tab="notices">公告</button>
      <button data-tab="users">普通成员</button>
      <button data-tab="admins">管理员账号</button>
      <button data-tab="bans">封禁名单</button>
    </div>

    <div id="tabActivities">
      <div class="row-actions" style="margin-bottom:14px">
        <button class="btn primary small" data-new="signup">＋ 发起报名</button>
        <button class="btn small" data-new="survey">＋ 发起问卷</button>
        <button class="btn small" data-new="poll">＋ 发起投票</button>
      </div>
      <div id="actList"></div>
    </div>

    <div id="tabNotices" style="display:none"></div>
    <div id="tabUsers" style="display:none"></div>
    <div id="tabAdmins" style="display:none"></div>
    <div id="tabBans" style="display:none"></div>
    <div id="editorView" style="display:none"></div>
    <div id="detailView" style="display:none"></div>
  </div>

</div>
<div id="toast"></div>
<script src="/static/common.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
